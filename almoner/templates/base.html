<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Almoner{% endblock %}</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- Progressive enhancement: every control below is a real form post.
     htmx makes it update in place; without it the page simply reloads. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --paper:#F6F7F4; --surface:#fff; --surface-2:#EDF0EB; --ink:#131815;
    --muted:#5D6A62; --rule:#D8DED7; --accent:#1C6B48; --accent-soft:#DCE9E1;
    --amber:#A2600B; --amber-soft:#F6EAD4; --crimson:#97241F;
    --f-display:"Newsreader",Georgia,serif;
    --f-body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0E1210; --surface:#161C18; --surface-2:#1C231E; --ink:#E7EDE8;
    --muted:#97A79C; --rule:#28322B; --accent:#52B786; --accent-soft:#1B2A22;
    --amber:#D99A3C; --amber-soft:#2A2318; --crimson:#E08279;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
       font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding-inline:22px;padding-block:0 64px}
  a{color:var(--accent);text-underline-offset:2px}

  header.top{border-bottom:1px solid var(--rule);padding-block:30px 20px;
       display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
  .brand{font-family:var(--f-display);font-size:1.9rem;font-weight:600;
       letter-spacing:-.015em;margin:0;line-height:1}
  .sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;
       text-transform:uppercase;color:var(--muted);margin:7px 0 0}
  nav{display:flex;gap:16px;font-size:14px;align-items:center}

  .counter{display:flex;gap:0;border:1px solid var(--rule);margin:26px 0 8px;background:var(--surface)}
  .count{flex:1;padding:18px 20px;border-right:1px solid var(--rule)}
  .count:last-child{border-right:0}
  .count .n{font-family:var(--f-mono);font-size:2.1rem;font-weight:500;
       letter-spacing:-.02em;display:block;line-height:1;font-variant-numeric:tabular-nums}
  .count .l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
       text-transform:uppercase;color:var(--muted);display:block;margin-top:8px}
  .count.you{background:var(--amber-soft)}
  .count.you .n{color:var(--amber)}
  .count.done .n{color:var(--accent)}
  .runline{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin:0 0 34px}

  h2{font-family:var(--f-display);font-weight:600;font-size:1.32rem;
     margin:34px 0 4px;letter-spacing:-.01em}
  .lede{color:var(--muted);font-size:14.5px;margin:0 0 16px;max-width:62ch}

  .item{border:1px solid var(--rule);background:var(--surface);margin-bottom:1px;padding:16px 18px}
  .item.you{border-left:3px solid var(--amber)}
  .item.answered{border-left:3px solid var(--accent)}
  .item-head{display:flex;gap:14px;align-items:baseline;justify-content:space-between}
  .ref{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .headline{font-weight:700;margin:0}
  .reason{color:var(--muted);font-size:14.5px;margin:6px 0 0;max-width:72ch}
  .cite{font-family:var(--f-mono);font-size:11px;color:var(--amber);
        background:var(--amber-soft);padding:2px 7px;display:inline-block;margin-top:9px}

  .options{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .opt{flex:1;min-width:240px;border:1px solid var(--rule);background:var(--paper);padding:12px 13px}
  .opt b{display:block;font-size:14px;margin-bottom:3px}
  .opt span{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
  button{font-family:var(--f-body);font-size:13.5px;font-weight:500;cursor:pointer;
     background:var(--accent);color:#fff;border:0;padding:7px 14px}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}

  .answered-note{background:var(--accent-soft);padding:10px 13px;margin-top:12px;font-size:14px}
  .answered-note b{font-weight:700}
  .answered-note span{font-family:var(--f-mono);font-size:11px;color:var(--muted);
     display:block;margin-top:3px}

  .compact{border:1px solid var(--rule);background:var(--surface)}
  .compact .row{display:grid;grid-template-columns:88px 1fr auto;gap:14px;
     padding:9px 16px;border-bottom:1px solid var(--rule);align-items:baseline;font-size:14px}
  .compact .row:last-child{border-bottom:0}
  .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;
     text-transform:uppercase;color:var(--accent);white-space:nowrap}
  .tag.draft{color:var(--muted)}

  pre.letter{background:var(--surface);border:1px solid var(--rule);padding:18px 20px;
     white-space:pre-wrap;font-family:var(--f-body);font-size:14.5px;margin:0 0 14px}
  dl.src{display:grid;grid-template-columns:180px 1fr;gap:0;border:1px solid var(--rule);
     background:var(--surface);margin:16px 0}
  dl.src dt{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);
     padding:9px 16px;border-bottom:1px solid var(--rule)}
  dl.src dd{margin:0;padding:9px 16px;border-bottom:1px solid var(--rule);font-size:14px}
  dl.src dt:last-of-type,dl.src dd:last-of-type{border-bottom:0}

  footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--rule);
     font-size:12.5px;color:var(--muted)}
  @media(max-width:620px){
    .counter{flex-direction:column}.count{border-right:0;border-bottom:1px solid var(--rule)}
    .compact .row{grid-template-columns:1fr}
    dl.src{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="brand">Almoner</p>
      <p class="sub">{{ org }} &middot; {{ period }}</p>
    </div>
    <nav>
      <a href="/">Review queue</a>
      <a href="/letters">Letters</a>
      <form method="post" action="/rerun" style="margin:0">
        <button class="ghost" type="submit">Close the month again</button>
      </form>
    </nav>
  </header>
  {% block body %}{% endblock %}
  <footer>
    <p>Almoner drafts documents for human approval and never sends anything.
       It is not tax or legal advice.</p>
  </footer>
</div>
</body>
</html>
